spring.application.name=home-automation-engine
# 每设备待执行命令队列上限（有界，禁止无界堆积）
homeauto.engine.per-device-queue-capacity=8
# 命令风暴策略：REJECT / DELAY / MERGE
homeauto.engine.backpressure-policy=REJECT
homeauto.engine.max-delay-millis=2000
# 命令执行超时（设备长时间无响应的判定阈值）
homeauto.engine.command-timeout-millis=1500
# 真实规则传播的容量保护：单次传播链路层数、访问事件节点数上限（超出按截断终止，非成环）
homeauto.engine.propagation-max-depth=16
homeauto.engine.propagation-max-events=256
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
# 试运行/复盘沙箱：单次传播链路层数、整场推演访问事件数、报告返回步骤数上限
homeauto.engine.dry-run-max-depth=16
homeauto.engine.dry-run-max-events=256
homeauto.engine.dry-run-max-steps=500
